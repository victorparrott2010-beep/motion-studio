<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<script src="../lib/motion.js"></script>
<style>
  /* ---------- shared ---------- */
  #stage { position: relative; overflow: hidden; background: var(--bg); }
  #main  { position: absolute; inset: 0; }
  #title { position: absolute; left: 0; right: 0; text-align: center; transform-origin: 50% 50%; }
  #title h1 { font-family: var(--font-display); font-weight: 400; color: var(--ink); line-height: 1.05; letter-spacing: -0.01em; }
  #title .w { display: inline-block; }
  #title .bar { height: 8px; border-radius: 4px; background: var(--accent); margin: 18px auto 0; width: 0; }

  .step { position: absolute; }
  .num  { font-family: var(--font-display); line-height: 0.8; color: var(--accent); transform-origin: 30% 80%; }
  .gold { height: 8px; border-radius: 4px; background: var(--accent); width: 0; }
  .hd   { font-family: var(--font-display); line-height: 1.05; color: var(--ink); }
  .ln   { font-family: var(--font-body); font-weight: 400; color: var(--muted); line-height: 1.35; text-wrap: balance; }

  #end  { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; }
  #end img  { display: block; }
  #end .name { font-family: var(--font-display); color: var(--ink); line-height: 1.05; }
  #end .cta  { display: inline-block; background: var(--accent); color: var(--on-accent); font-weight: 600;
               border-radius: 999px; letter-spacing: 0.01em; }
  #end .sub  { font-family: var(--font-body); color: var(--ink); font-weight: 400; letter-spacing: 0.02em; }

  /* ---------- wide 1920x1080: steps side by side ---------- */
  .wide #title    { top: 72px; }
  .wide #title h1 { font-size: 64px; }
  .wide .step     { top: 390px; width: 500px; }
  .wide .step:nth-of-type(1) { left: 140px; }
  .wide .step:nth-of-type(2) { left: 710px; }
  .wide .step:nth-of-type(3) { left: 1280px; }
  .wide .num  { font-size: 220px; }
  .wide .gold { margin: 34px 0 30px; }
  .wide .hd   { font-size: 62px; }
  .wide .ln   { font-size: 30px; margin-top: 18px; max-width: 460px; }
  .wide #end img   { height: 300px; margin-bottom: 36px; }
  .wide #end .name { font-size: 104px; }
  .wide #end .cta  { font-size: 36px; padding: 20px 52px; margin-top: 40px; }
  .wide #end .sub  { font-size: 26px; margin-top: 24px; }

  /* ---------- portrait 1080x1350 (Instagram): steps stacked ---------- */
  .tall #title    { top: 96px; }
  .tall #title h1 { font-size: 60px; }
  .tall .step     { left: 90px; width: 900px; height: 270px; display: grid;
                    grid-template-columns: 190px 1fr; grid-template-rows: auto auto auto 1fr;
                    column-gap: 20px; align-items: start; }
  .tall .step:nth-of-type(1) { top: 300px; }
  .tall .step:nth-of-type(2) { top: 625px; }
  .tall .step:nth-of-type(3) { top: 950px; }
  .tall .num  { font-size: 200px; grid-row: 1 / span 4; grid-column: 1; padding-top: 6px; }
  .tall .gold { margin: 22px 0 26px; grid-column: 2; }
  .tall .hd   { font-size: 58px; grid-column: 2; }
  .tall .ln   { font-size: 30px; margin-top: 14px; grid-column: 2; }
  .tall #end img   { height: 340px; margin-bottom: 40px; }
  .tall #end .name { font-size: 84px; }
  .tall #end .cta  { font-size: 36px; padding: 20px 52px; margin-top: 44px; }
  .tall #end .sub  { font-size: 26px; margin-top: 26px; }
</style>
</head>
<body>
<div id="stage">
  <div id="main">
    <div id="title"><h1></h1><div class="bar"></div></div>
    <div id="steps"></div>
  </div>
  <div id="end">
    <img src="../assets/logo.webp" alt="">
    <div class="name"></div>
    <div><span class="cta"></span></div>
    <div class="sub"></div>
  </div>
</div>
<script>
  // ===== Your words (only these appear on screen) =====
  const COPY = {
    title: 'Create Capacity for Growth',
    steps: [
      { headline: 'Survey and Plan',       line: 'Assess your people and systems and plan a path forward.' },
      { headline: 'Activate and Navigate', line: 'Execute the plan, make adjustments and stay on course.' },
      { headline: 'Achieve Results',       line: 'Add more clients and improve sales revenue.' },
    ],
    name: 'Cyber Capitol Management',
    cta:  'Get My Readiness Score',
    ctaSub: '5 multiple-choice questions • Takes less than 2 minutes',
  };

  // ===== Size / layout =====
  const sizeParam = new URLSearchParams(location.search).get('size');
  const TALL = sizeParam === '1080x1350';
  window.SIZE = TALL ? [1080, 1350] : [1920, 1080];
  window.DURATION = 15;
  const [W, H] = window.SIZE;
  document.body.classList.add(TALL ? 'tall' : 'wide');
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';

  // ===== Build DOM from COPY =====
  const h1 = document.querySelector('#title h1');
  h1.innerHTML = COPY.title.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
  const stepsEl = document.getElementById('steps');
  COPY.steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'step';
    el.innerHTML = `<div class="num">${i + 1}</div><div class="gold"></div>
                    <div class="hd">${s.headline}</div><div class="ln">${s.line}</div>`;
    stepsEl.appendChild(el);
  });
  document.querySelector('#end .name').textContent = COPY.name;
  document.querySelector('#end .cta').textContent = COPY.cta;
  document.querySelector('#end .sub').textContent = COPY.ctaSub;

  // ===== Elements & measurements =====
  const { tween, ease, progress, lerp } = M;
  const title = document.getElementById('title');
  const words = [...title.querySelectorAll('.w')];
  const tBar = title.querySelector('.bar');
  const steps = [...document.querySelectorAll('.step')].map(el => ({
    el, num: el.querySelector('.num'), gold: el.querySelector('.gold'),
    hd: el.querySelector('.hd'), ln: el.querySelector('.ln'),
  }));
  const end = document.getElementById('end');
  const main = document.getElementById('main');
  const logo = end.querySelector('img'), name = end.querySelector('.name'), cta = end.querySelector('.cta');
  const sub = end.querySelector('.sub');

  const TITLE_SCALE = TALL ? 1.45 : 1.9;      // how big the title starts before shrinking to the header
  const BAR_W = TALL ? 120 : 150;
  const STEP_START = [3.2, 5.8, 8.4];
  const RECAP = 11.0, PANEL = 11.8;

  window.render = (t) => {
    // --- Title: words rise in, centered and large; then glide up to the header ---
    words.forEach((w, i) => {
      const s = 0.2 + i * 0.18;
      w.style.opacity = tween(t, s, s + 0.45, 0, 1, ease.linear);
      w.style.transform = `translateY(${tween(t, s, s + 0.75, 50, 0, ease.outBack)}px)`;
    });
    tBar.style.width = tween(t, 1.0, 1.8, 0, BAR_W, ease.outExpo) + 'px';
    const centerDy = H / 2 - (title.offsetTop + title.offsetHeight / 2);
    const m = ease.inOutCubic(progress(t, 2.5, 3.2));
    title.style.transform = `translateY(${lerp(centerDy, 0, m)}px) scale(${lerp(TITLE_SCALE, 1, m)})`;

    // --- Steps: appear one at a time; earlier ones soften; all return for the recap ---
    steps.forEach((st, i) => {
      const S = STEP_START[i];
      st.num.style.opacity = tween(t, S, S + 0.4, 0, 1, ease.linear);
      st.num.style.transform = `scale(${tween(t, S, S + 0.8, 0.6, 1, ease.outBack)})`;
      st.gold.style.width = tween(t, S + 0.3, S + 1.0, 0, 90, ease.outExpo) + 'px';
      st.hd.style.opacity = tween(t, S + 0.4, S + 0.9, 0, 1, ease.linear);
      st.hd.style.transform = `translateX(${tween(t, S + 0.4, S + 1.1, 40, 0, ease.outCubic)}px)`;
      st.ln.style.opacity = tween(t, S + 0.8, S + 1.3, 0, 1, ease.linear);
      st.ln.style.transform = `translateY(${tween(t, S + 0.8, S + 1.4, 16, 0, ease.outCubic)}px)`;

      const next = STEP_START[i + 1] ?? RECAP;
      let dim = 1 - 0.6 * ease.inOutCubic(progress(t, next, next + 0.5));
      dim += (1 - dim) * ease.inOutCubic(progress(t, RECAP, RECAP + 0.6));
      st.el.style.opacity = i < 2 ? dim : 1;
    });

    // --- Hand-off: title + steps drift up and fade, then logo, name, call to action ---
    const out = ease.inOutCubic(progress(t, PANEL, PANEL + 0.7));
    main.style.opacity = 1 - out;
    main.style.transform = `translateY(${-40 * out}px)`;
    logo.style.opacity = tween(t, 12.4, 13.0, 0, 1, ease.linear);
    logo.style.transform = `scale(${tween(t, 12.4, 13.3, 0.85, 1, ease.outCubic)})`;
    name.style.opacity = tween(t, 12.8, 13.3, 0, 1, ease.linear);
    name.style.transform = `translateY(${tween(t, 12.8, 13.5, 30, 0, ease.outCubic)}px)`;
    cta.style.opacity = tween(t, 13.4, 13.9, 0, 1, ease.linear);
    cta.style.transform = `translateY(${tween(t, 13.4, 14.1, 20, 0, ease.outCubic)}px)`;
    sub.style.opacity = tween(t, 13.8, 14.3, 0, 1, ease.linear);
    sub.style.transform = `translateY(${tween(t, 13.8, 14.4, 14, 0, ease.outCubic)}px)`;
  };

  window.render(0);
</script>
</body>
</html>
